name: Build image
description: Builds the fin image and pushes it to Docker Hub

inputs:
  ENVIRONMENT:
    description: "'staging' or 'production'"
    required: true
  SHA:
    description: "Full commit SHA the image is built from"
    required: true
  PR_ID:
    description: "Pull request to comment the pushed tags on"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build and push image
      shell: bash
      run: |
        bun run .github/scripts/src/build-image \
          --environment "${{ inputs.ENVIRONMENT }}" \
          --sha "${{ inputs.SHA }}" \
          --prId "${{ inputs.PR_ID }}"

name: CD
run-name: Running continuous deployment on ${{ github.actor }}'s commits

permissions:
  contents: read

on:
  push:
    tags:
      - "*"

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  promoteImage:
    name: Promote image to ${{ github.ref_name }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@3fe33a6496cc37947213e96e6f03445afa2e2a9c
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true

      - name: Get parent SHA
        id: parent
        run: echo "sha=$(git rev-parse ${{ github.sha }}^1)" >> "$GITHUB_OUTPUT"

      - name: Promote image
        uses: ./.github/composite/promote-image
        with:
          RELEASE_TAG: ${{ github.ref_name }}
          SHA: ${{ steps.parent.outputs.sha }}

  deployProduction:
    name: Deploy to production
    runs-on: ubuntu-26.04
    needs: [promoteImage]
    timeout-minutes: 20

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@3fe33a6496cc37947213e96e6f03445afa2e2a9c
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true
          INSTALL_JUST: true
          INSTALL_MIGRATE: "true"

      - name: Migrate production database
        uses: ./.github/composite/migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - name: Deploy
        uses: ./.github/composite/deploy
        with:
          RELEASE_TAG: ${{ github.ref_name }}

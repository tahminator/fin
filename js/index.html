<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Personal finance tracker" />
    <meta name="apple-mobile-web-app-title" content="fin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // iOS ignores `media` on apple-touch-icon and snapshots the icon at Add to Home Screen.
      (() => {
        const icon = document.getElementById("apple-touch-icon");
        const darkScheme = matchMedia("(prefers-color-scheme: dark)");
        const applyScheme = () => {
          icon.href = darkScheme.matches
            ? "/apple-touch-icon-180x180-dark.png"
            : "/apple-touch-icon-180x180.png";
        };

        applyScheme();
        darkScheme.addEventListener("change", applyScheme);
      })();
    </script>
    <title>fin</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

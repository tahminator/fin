name: Promote image to release tag
description: Re-tags the image built from the tagged commit's parent with the release version

inputs:
  RELEASE_TAG:
    description: "For example, 1.2.3"
    required: true
  SHA:
    description: "Full SHA of the tagged commit's parent"
    required: true

runs:
  using: composite
  steps:
    - name: Promote image
      shell: bash
      run: bun run .github/scripts/src/promote-image --releaseTag "${{ inputs.RELEASE_TAG }}" --sha "${{ inputs.SHA }}"

version: "2"

linters:
  default: standard

  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unparam

  settings:
    depguard:
      rules:
        mcpserver:
          files:
            - "**/internal/mcpserver/**"
          deny:
            - pkg: github.com/tahminator/fin/internal/provider
              desc: the MCP server must never reach Plaid directly; it only gets the Sync interface
            - pkg: github.com/tahminator/fin/internal/encryption
              desc: the MCP server must never see bank access tokens
            - pkg: github.com/tahminator/fin/internal/service
              desc: depend on the narrow interfaces declared in mcpserver, not on services that can link or remove banks
            - pkg: github.com/plaid/plaid-go
              desc: the MCP server must never call Plaid

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    rules:
      - path: internal/encryption/cipher.go
        linters: [gosec]
        text: G407

      - path: internal/handler/auth.go
        linters: [gosec]
        text: G124

      - path: internal/repository/postgres/
        linters: [gosec]
        text: G101

      - path: (internal/server/spa.go|tools/nocomments/main.go)
        linters: [gosec]
        text: G703

      - path: (internal/domain/rate_limit.go|internal/handler/oauth.go|internal/service/oauth_test.go)
        linters: [gosec]
        text: G101

      - path: internal/handler/oauth.go
        linters: [gosec]
        text: G710

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/tahminator/fin
